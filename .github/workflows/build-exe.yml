name: Build EXE (Windows/Linux/macOS)

# 用 Node.js 官方 Single Executable Application (SEA) 方案把聚合服务打包为单文件可执行程序，
# 彻底绕开 pkg / @yao-pkg-pkg 上游基础二进制已下线（404）导致构建失败的问题，免去本机装 Node。
# 流程：每个 OS runner 用 esbuild 把 server.js（+lib/* + embedded-assets）打成单文件，
#       再用 node --experimental-sea-config 生成 blob，复制对应平台 Node 二进制并 postject 注入。
# 发布：因 GitHub 仓库单文件硬上限 100MB，SEA 产物（Node 二进制 80–120MB）无法入库 downloads/，
#       故改为发布到 GitHub Release（Release assets 支持大文件）。version.json 的 downloads.* 链接指向对应 Release。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

# 允许工作流创建 Release 并把构建产物发布上去
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: alphasun-beihai-climate.exe
          - os: ubuntu-latest
            artifact: alphasun-beihai-climate-linux
          - os: macos-latest
            artifact: alphasun-beihai-climate-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install SEA build deps
        working-directory: app
        run: npm install esbuild postject

      - name: Regenerate embedded assets (inline public/ into exe)
        working-directory: app
        run: node build-assets.js

      - name: Bundle server.js (esbuild → single file)
        working-directory: app
        run: npx esbuild server.js --bundle --platform=node --target=node22 --format=cjs --outfile=dist/bundle.js

      - name: Generate SEA preparation blob
        working-directory: app
        run: node --experimental-sea-config sea-config.json

      - name: Copy Node binary + inject SEA blob
        working-directory: app
        shell: bash
        run: |
          NODE_BIN="$(command -v node)"
          cp "$NODE_BIN" "dist/${{ matrix.artifact }}"
          npx postject "dist/${{ matrix.artifact }}" NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Ad-hoc codesign (macOS, bypass Gatekeeper)
        if: matrix.os == 'macos-latest'
        working-directory: app
        run: codesign --force --sign - "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release (绕过仓库 100MB 单文件限制)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./app/package.json').version")"
          mkdir -p dist
          for f in alphasun-beihai-climate.exe alphasun-beihai-climate-linux alphasun-beihai-climate-macos; do
            if [ -f "artifacts/$f/$f" ]; then cp "artifacts/$f/$f" "dist/$f"; else echo "missing $f"; fi
          done
          ls -la dist/
          NOTES="CI 自动发布的单文件可执行程序（Node SEA，跨平台）：Windows=alphasun-beihai-climate.exe，Linux=alphasun-beihai-climate-linux，macOS=alphasun-beihai-climate-macos（ad-hoc 签名，首次运行需在 系统设置-隐私与安全性 中允许）"
          gh release create "$TAG" --title "AlphaSun $TAG" --notes "$NOTES" dist/* 2>/dev/null || gh release upload "$TAG" --clobber dist/*
