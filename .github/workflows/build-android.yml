name: Build Android APK

# 在 GitHub 云端构建真实可安装的 APK，免去本机安装 Android Studio。
# 触发：推送到 main（含 app-android/ 或本文件改动），或手动 Run workflow。
# 构建完成后自动把 APK 发布到同版本 GitHub Release（资产名 alphasun-beihai-climate.apk，与 exe/ios 一致）。
on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 允许工作流发布 Release 资产
permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 说明：android-actions/setup-android@v3 的 packages 默认值是 'tools platform-tools'，
      # 而 Google 已下架旧版 tools 包（已被 cmdline-tools 取代），sdkmanager 会报
      # "Warning: Failed to find package 'tools'" 并以退出码 1 终止，导致整个 workflow 失败
      # （失败发生在 SDK 安装阶段，远早于 gradle 与版本号逻辑）。
      # 显式给出 packages 即可完全覆盖默认值，不再请求已下架的 tools 包；
      # 该 action 仍会自行准备 cmdline-tools（v3 默认 12266719 → 16.0，runner 已预装则复用）、
      # 接受许可证，并导出 ANDROID_HOME / ANDROID_SDK_ROOT 与 sdkmanager 到 PATH。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 幂等：上面已装过则此处为 no-op（sdkmanager 对已安装包返回 0），保留作为兜底。
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync

      - name: Patch Android version (与 web 版本一致)
        run: |
          VER=$(node -p "require('./package.json').version")
          # versionCode 必须随版本号单调递增（Android 会拒绝 versionCode 更低的覆盖安装）。
          # 版本号先零填充到 3 段（主.次.修）再按 1000 进制累加：
          #   8.2.1 -> 8002001（旧公式 80201）、8.3 -> 8003000（旧公式 803，属降级会导致装不上）
          CODE=$(node -p "require('./package.json').version.split('.').concat(['0','0']).slice(0,3).reduce((a,b)=>a*1000+(+b),0)")
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$f"
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VER\"/" "$f"
            echo "Android versionName -> $VER (code $CODE)"
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-beihai-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 发布 APK 到同版本 GitHub Release（永久留存，与 exe / ipa 一致；资产名统一为 alphasun-beihai-climate.apk）。
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app-android
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/downloads"
          TAG="v$(node -p "require('./package.json').version")"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="$GITHUB_WORKSPACE/downloads/alphasun-beihai-climate.apk"
          cp "$SRC" "$ASSET"
          echo "Publishing $ASSET to $TAG"
          gh release upload "$TAG" --clobber "$ASSET" 2>/dev/null || \
            gh release create "$TAG" --title "AlphaSun $TAG" \
              --notes "Android APK（CI 自动发布，debug 签名，仅供自用/测试安装）。" "$ASSET"
          echo "done"
