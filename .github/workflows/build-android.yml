name: Build Android APK

# 在 GitHub 云端构建真实可安装的 APK，免去本机安装 Android Studio。
# 触发：推送到 main（含 app-android/ 或本文件改动），或手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-beihai-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
