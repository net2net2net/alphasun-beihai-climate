name: Build Android APK

# 在 GitHub 云端构建真实可安装的 APK，免去本机安装 Android Studio。
# 触发：推送到 main（含 app-android/ 或本文件改动），或手动 Run workflow。
# 构建完成后自动把 APK 发布到同版本 GitHub Release（资产名 alphasun-beihai-climate.apk，与 exe/ios 一致）。
on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 允许工作流发布 Release 资产
permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync

      - name: Patch Android version (与 web 版本一致)
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -p "require('./package.json').version.split('.').reduce((a,b)=>a*100+(+b),0)")
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$f"
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VER\"/" "$f"
            echo "Android versionName -> $VER (code $CODE)"
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-beihai-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 发布 APK 到同版本 GitHub Release（永久留存，与 exe / ipa 一致；资产名统一为 alphasun-beihai-climate.apk）。
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app-android
        run: |
          set -e
          TAG="v$(node -p "require('./package.json').version")"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="$GITHUB_WORKSPACE/downloads/alphasun-beihai-climate.apk"
          cp "$SRC" "$ASSET"
          echo "Publishing $ASSET to $TAG"
          gh release upload "$TAG" --clobber "$ASSET" 2>/dev/null || \
            gh release create "$TAG" --title "AlphaSun $TAG" \
              --notes "Android APK（CI 自动发布，debug 签名，仅供自用/测试安装）。" "$ASSET"
          echo "done"
