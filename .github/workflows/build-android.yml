name: Build Android APK

# 在 GitHub 云端构建真实可安装的 APK，免去本机安装 Android Studio。
# 触发：推送到 main（含 app-android/ 或本文件改动），或手动 Run workflow。
# 构建完成后自动把 APK 提交回仓库 downloads/ 目录（实现 "CI 自动写 downloads"）。
on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 允许工作流把构建产物提交回仓库
permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync

      - name: Patch Android version (与 web 版本一致)
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -p "require('./package.json').version.split('.').reduce((a,b)=>a*100+(+b),0)")
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$f"
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VER\"/" "$f"
            echo "Android versionName -> $VER (code $CODE)"
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-beihai-apk
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 构建产物写回仓库 downloads/，使 "CI 自动写 downloads" 成立。
      # 注意：本步骤仅改动 downloads/，不命中 paths 触发器，不会产生构建循环。
      - name: Publish APK to downloads/
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/downloads/alphasun-beihai-climate-debug.apk"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/alphasun-beihai-climate-debug.apk
          git commit -m "ci: 自动发布 APK v$(node -p "require('./package.json').version") 至 downloads" || echo "no changes"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:refs/heads/main
