name: Build iOS

on:
  # 手动触发：在仓库 Actions → Build iOS → Run workflow 点击即可。
  # （不挂到 push，避免每次提交都消耗 macOS 构建额度）
  workflow_dispatch:
  # 如需 push main 自动构建，取消下面注释：
  # push:
  #   branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # iOS 原生工程依赖 CocoaPods（macOS 跑卡机自带，缺失则装）
      - name: Ensure CocoaPods
        run: which pod || sudo gem install cocoapods

      - name: Install web deps
        working-directory: app-android
        run: npm install

      # 生成 iOS 原生工程（首次会执行 pod install）
      - name: Add iOS platform
        working-directory: app-android
        run: npx cap add ios || true

      # 把最新前端资源同步进 iOS 工程
      - name: Sync web assets into iOS project
        working-directory: app-android
        run: npx cap sync ios

      # ===== 数据层护栏（对齐安卓修复方案，防打出「无数据」的 IPA）=====
      # iOS 直接复用 app-android/www，本步确认浏览器版聚合层 data.js 与 app.js 原生分支存在，
      # 否则 iOS 会重演安卓「无数据获取/展示」的故障。
      - name: Assert data layer present (no data-less IPA)
        working-directory: app-android
        run: |
          set -e
          test -f www/js/data.js || { echo "::error::www/js/data.js 缺失（浏览器版聚合层），iOS 将无数据"; exit 1; }
          test -f www/js/app.js || { echo "::error::www/js/app.js 缺失"; exit 1; }
          grep -q "AlphaData.buildOverview" www/js/app.js || { echo "::error::app.js 缺少原生数据分支（ensureAlphaData / AlphaData.buildOverview），iOS 将无数据"; exit 1; }
          grep -q "CapacitorHttp" www/js/data.js || { echo "::error::data.js 未启用 CapacitorHttp，iOS 跨域取数将失败"; exit 1; }
          echo "data layer OK: data.js + 原生 app.js 分支已就位"

      # 注入 ATS 放行（双保险）：所有数据源均为 HTTPS，ATS 本不应拦截；
      # 此为边缘情况保险，避免任何非预期明文/重定向被 WKWebView 拒绝导致模块无数据。
      # 同时确保所有 fetch 走 CapacitorHttp 原生 HTTP（见 capacitor.config.ts plugins.CapacitorHttp）。
      - name: Inject ATS exception (allow arbitrary loads)
        working-directory: app-android
        run: |
          PLIST=$(find ios/App -name "Info.plist" -path "*/App/*" | head -1)
          if [ -z "$PLIST" ]; then echo "Info.plist not found, skip"; exit 0; fi
          echo "Target Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          echo "ATS injected:"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true

      # 检测是否配置了签名密钥（step 的 if 不能直接读 secrets，故用输出传递）
      - name: Check signing secrets
        id: signcheck
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -n "$P12" ]; then echo "has_cert=true" >> "$GITHUB_OUTPUT"; else echo "has_cert=false" >> "$GITHUB_OUTPUT"; fi

      # ===== 若提供签名密钥（仓库 Secrets），则导入并手动签名 =====
      - name: Decode & install signing cert + profile
        if: ${{ steps.signcheck.outputs.has_cert == 'true' }}
        env:
          P12: ${{ secrets.APPLE_CERT_P12 }}
          P12_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          echo "$P12"    | base64 --decode > cert.p12
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          security create-keychain -p "temp" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PWD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "temp" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ===== 归档：有密钥→签名归档；无密钥→免签归档（仍产出完整工程）=====
      - name: Archive (signed)
        if: ${{ steps.signcheck.outputs.has_cert == 'true' }}
        working-directory: app-android/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_NAME }}
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="iPhone Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$TEAM"

      - name: Archive (unsigned)
        if: ${{ steps.signcheck.outputs.has_cert == 'false' }}
        working-directory: app-android/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      # ===== 有密钥则导出可安装 IPA（method 由 APPLE_EXPORT_METHOD 决定：app-store / ad-hoc / development）=====
      - name: Export IPA (signed)
        if: ${{ steps.signcheck.outputs.has_cert == 'true' }}
        working-directory: app-android/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_NAME }}
          METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>net.net2net.alphasun</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist ExportOptions.plist

      # ===== 打包未签名 IPA：供用户在 Windows 用 AltServer / Sideloadly + 免费 Apple ID 自签装机（无需 Mac / 付费）=====
      # 关键：彻底清除所有既有签名（含嵌套 Frameworks），交给 Sideloadly 从干净状态重签，
      # 避免「部分签名」导致 Sideloadly 报 Guru Meditation Invalid file。
      - name: Package unsigned IPA
        if: always()
        working-directory: app-android/ios/App
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          APP2="Payload/App.app"
          # 1) 移除主程序及所有嵌套框架/动态库的签名
          codesign --remove-signature "$APP2" 2>/dev/null || true
          find "$APP2" -type d -name "*.framework" -exec codesign --remove-signature {} \; 2>/dev/null || true
          find "$APP2" -type f -name "*.dylib" -exec codesign --remove-signature {} \; 2>/dev/null || true
          # 2) 删除所有残留签名目录与描述文件
          find "$APP2" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find "$APP2" -type f -name "CodeResources" -delete 2>/dev/null || true
          find "$APP2" -type f -name "embedded.mobileprovision" -delete 2>/dev/null || true
          # 3) 打包
          rm -f build/App.ipa
          zip -r build/App.ipa Payload
          echo "IPA size: $(du -h build/App.ipa | cut -f1)"

      # ===== 产物：完整 Xcode 工程（用户用自己 Apple 账号在 Xcode 签名即可装 iPhone）=====
      - name: Upload Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-ios-xcode-project
          path: app-android/ios
          retention-days: 30

      # ===== 产物：未签名 IPA（Windows + AltServer/Sideloadly + 免费 Apple ID 自签装机）=====
      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-ios-unsigned-ipa
          path: app-android/ios/App/build/App.ipa
          retention-days: 30

      # ===== 产物：签名 IPA（仅当提供密钥时才有）=====
      - name: Upload signed IPA
        if: ${{ steps.signcheck.outputs.has_cert == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-ios-ipa
          path: app-android/ios/App/build/ipa/*.ipa
          retention-days: 30

      # ===== 发布到 GitHub Release（永久留存，与 EXE 一致）=====
      # 优先发布签名 IPA；无密钥时发布免签 IPA（用户用 Sideloadly + 免费 Apple ID 自签装机）。
      # 资产统一命名为 alphasun-beihai-climate-ios.ipa，使 version.json 下载链接稳定。
      - name: Publish IPA to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v$(node -p "require('./app-android/package.json').version")"
          SIGNED=$(ls app-android/ios/App/build/ipa/*.ipa 2>/dev/null | head -1 || true)
          UNSIGNED="app-android/ios/App/build/App.ipa"
          if [ -n "$SIGNED" ]; then SRC="$SIGNED"; else SRC="$UNSIGNED"; fi
          if [ ! -f "$SRC" ]; then echo "no IPA produced, skip publish"; exit 0; fi
          ASSET="app-android/ios/App/build/alphasun-beihai-climate-ios.ipa"
          cp "$SRC" "$ASSET"
          echo "Publishing $ASSET to $TAG"
          gh release upload "$TAG" --clobber "$ASSET" 2>/dev/null || \
            gh release create "$TAG" --title "AlphaSun $TAG" \
              --notes "iOS IPA（CI 自动发布）：未签名版需用 Sideloadly + 免费 Apple ID 自签装机（证书 7 天有效，到期前重签续期）；若仓库配置了 APPLE_CERT_P12 等 Secrets 则为已签名版（可用 AltStore/企业/App Store 分发）。" "$ASSET"
          echo "done"
