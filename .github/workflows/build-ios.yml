name: Build iOS

on:
  # 仅在 GitHub Actions 页面手动触发（workflow_dispatch），
  # 避免每次 push 都消耗 macOS 构建额度；正式上架前你点一下即可运行。
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # iOS 原生工程依赖 CocoaPods
      - name: Ensure CocoaPods
        run: which pod || sudo gem install cocoapods

      - name: Install web deps
        working-directory: app-android
        run: npm install

      - name: Add iOS platform
        working-directory: app-android
        run: npx cap add ios

      - name: Sync web assets into iOS project
        working-directory: app-android
        run: npx cap sync ios

      # 免签构建（仅产出未签名 App，用于验证工程可编译）。
      # 如需签出可安装/上架的 IPA，请在仓库 Secrets 配置：
      #   APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_PROVISIONING_PROFILE, APPLE_TEAM_ID
      # 并改用：
      #   xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
      #     -archivePath build/App.xcarchive archive \
      #     CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="iPhone Distribution" \
      #     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - name: Build (unsigned)
        working-directory: app-android/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: Upload unsigned build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphasun-ios-build
          path: app-android/ios/App/build/**
