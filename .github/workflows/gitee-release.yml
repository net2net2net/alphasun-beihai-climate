name: Sync Release to Gitee

# 将 GitHub Release 的构建产物（Windows/Linux/macOS exe、Android APK、iOS IPA）同步发布到 Gitee Release。
# 触发：手动 Run workflow（推荐，待 GitHub 三端构建完成后执行，确保 5 个资产齐全）；
#       也可在 GitHub Release 发布后自动触发（release: published）。
# 前置：仓库 Settings → Secrets and variables → Actions 中新增 GITEE_TOKEN（Gitee 私人令牌，需 projects 权限）。
#       token 不会写入仓库，仅经由 Secret 注入本工作流。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（例如 v8.5）。留空则同步最新 Release。'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      OWNER: net2net2net
      REPO: alphasun-beihai-climate
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Syncing tag: $TAG"

      - name: Download GitHub Release assets
        run: |
          mkdir -p _gh_assets
          gh release download "${{ steps.tag.outputs.tag }}" -R "$OWNER/$REPO" --dir _gh_assets --clobber
          echo "Downloaded assets:"
          ls -la _gh_assets/

      - name: Create or reuse Gitee Release
        id: rel
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          API="https://gitee.com/api/v5/repos/$OWNER/$REPO"
          # 注意：Gitee 列表接口会忽略 tag_name 过滤参数，必须本地用 jq 精确匹配
          EXISTING=$(curl -s -G "$API/releases" \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            | jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing Gitee release id=$EXISTING (tag=$TAG)"
            echo "id=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "Creating Gitee release $TAG"
            HTTP=$(curl -s -o /tmp/gitee_release.json -w '%{http_code}' -X POST \
              "$API/releases?access_token=$GITEE_TOKEN" \
              -F "tag_name=$TAG" \
              -F "target_commitish=$TAG" \
              -F "name=AlphaSun $TAG" \
              -F "body=由 GitHub Actions 自动从 GitHub Release 同步的构建产物（Windows/Linux/macOS 单文件 exe、Android APK、iOS IPA）。源：GitHub Release $TAG。" \
              -F "prerelease=false")
            REL_ID=$(jq -r '.id' /tmp/gitee_release.json | head -1)
            if [ -z "$REL_ID" ] || { [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; }; then
              echo "::error::Gitee 创建 Release 失败 http=$HTTP resp=$(head -c 400 /tmp/gitee_release.json)"
              exit 1
            fi
            echo "Created Gitee release id=$REL_ID"
            echo "id=$REL_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to Gitee Release
        run: |
          set -euo pipefail
          REL_ID="${{ steps.rel.outputs.id }}"
          API="https://gitee.com/api/v5/repos/$OWNER/$REPO"
          shopt -s nullglob
          for f in _gh_assets/*; do
            echo "Uploading $(basename "$f")"
            HTTP=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              "$API/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN" \
              -F "file=@$f")
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
              echo "::error::Upload failed for $(basename "$f") http=$HTTP resp=$(head -c 300 /tmp/up.json)"
              exit 1
            fi
            echo "  -> ok ($HTTP)"
          done
          echo "Gitee Release sync done: https://gitee.com/$OWNER/$REPO/releases"
          echo "Gitee Release sync done: https://gitee.com/$OWNER/$REPO/releases"
